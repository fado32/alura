name: Ejecutar Bot de Alertas

on:
  schedule:
    # A las 10:00 y a las 22:00 UTC todos los días
    - cron: '0 10,23 * * *'
  
  # Añadimos una prueba manual para poder lanzarlo cuando quieras
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar código del repositorio
      uses: actions/checkout@v4

    - name: Configurar entorno de Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Ejecutar el script del bot
      run: |
        python bot.py
